<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d18">
<title>HEAVYSIDE — gravity puzzle prototype</title>
<style>
  /* HEAVYSIDE — single-theme by design: a neon arcade screen is dark in any OS theme. */
  :root {
    --bg: #0a0d18;
    --panel: #121729;
    --wall: #1a2138;
    --line: #232c4a;
    --ink: #c7cfe6;
    --ink-dim: #6b7694;
    --core: #3ee6d0;   /* player */
    --bubble: #c98bff;
    --stone: #8b96b0;
    --danger: #ff5c49;
    --gold: #ffce4f;
    --portal: #57e07a;
    --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    display: flex; flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; gap: 8px;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  #title {
    font-size: 15px; font-weight: 700; letter-spacing: 0.28em; color: var(--core);
    text-shadow: 0 0 14px rgba(62, 230, 208, 0.55);
  }
  #levelTag { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-dim); text-transform: uppercase; }
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; letter-spacing: 0.1em; color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  #hud b { color: var(--ink); font-weight: 600; }
  #compass {
    display: inline-block; color: var(--core); font-size: 14px;
    transition: transform 200ms ease; will-change: transform;
  }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(18, 23, 41, 0.92); border: 1px solid var(--line);
    color: var(--ink); font-size: 12px; letter-spacing: 0.12em;
    padding: 7px 14px; border-radius: 999px; opacity: 0;
    transition: opacity 180ms ease; pointer-events: none; white-space: nowrap;
  }
  #hint {
    text-align: center; font-size: 11.5px; color: var(--ink-dim);
    letter-spacing: 0.04em; min-height: 2.4em; line-height: 1.2em; padding: 0 8px;
    text-wrap: balance;
  }
  nav { display: flex; gap: 8px; justify-content: center; }
  nav button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 0; flex: 1; max-width: 118px; cursor: pointer;
  }
  nav button:active { background: var(--wall); transform: translateY(1px); }
  nav button:focus-visible, .ovl button:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }
  .ovl {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(10, 13, 24, 0.94); z-index: 5; padding: 20px; text-align: center;
  }
  .ovl.show { display: flex; }
  .ovl h2 { font-size: 18px; letter-spacing: 0.3em; font-weight: 700; }
  .ovl .stars { font-size: 30px; letter-spacing: 0.2em; color: var(--gold); text-shadow: 0 0 18px rgba(255, 206, 79, 0.45); }
  .ovl .sub { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .ovl button {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 26px; cursor: pointer; min-width: 220px;
  }
  .ovl button.primary { border-color: var(--core); color: var(--core); box-shadow: 0 0 18px rgba(62, 230, 208, 0.18); }
  #levelGrid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    width: 100%; max-width: 420px; max-height: 62vh; overflow-y: auto;
  }
  #levelGrid button {
    min-width: 0; padding: 12px 8px; display: flex; flex-direction: column; gap: 5px; align-items: center;
  }
  #levelGrid .lv-name { font-size: 11px; letter-spacing: 0.1em; }
  #levelGrid .lv-stars { font-size: 12px; color: var(--gold); letter-spacing: 0.15em; }
  #levelGrid .lv-stars .off { color: var(--line); }
  @media (prefers-reduced-motion: reduce) {
    #compass { transition: none; }
  }
</style>

<div id="app">
  <header>
    <div id="title">HEAVYSIDE</div>
    <div id="levelTag">Level 1 / 10</div>
  </header>
  <div id="hud">
    <span id="lvName"><b>First Fall</b></span>
    <span>grav <span id="compass">&#x2193;</span></span>
    <span>moves <b id="mv">0</b>/<span id="par">1</span> &nbsp;&#9733;<b id="starCt">0</b>/<span id="starTot">0</span></span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>

    <div class="ovl" id="winOvl">
      <h2>CLEAR</h2>
      <div class="stars" id="winStars"></div>
      <div class="sub" id="winSub"></div>
      <button class="primary" id="btnNext">Next level</button>
      <button id="btnReplay">Replay</button>
    </div>

    <div class="ovl" id="lvlOvl">
      <h2>LEVELS</h2>
      <div id="levelGrid"></div>
      <button id="btnCloseLvls">Back</button>
    </div>

    <div class="ovl" id="endOvl">
      <h2>ALL CLEAR</h2>
      <div class="stars" id="endStars"></div>
      <div class="sub">You beat the HEAVYSIDE prototype.<br>Chase 3&#9733; on every level?</div>
      <button class="primary" id="btnAgain">Level select</button>
    </div>
  </div>
  <div id="hint">Swipe (or arrow keys) to tilt gravity.</div>
  <nav>
    <button id="btnUndo">Undo</button>
    <button id="btnReset">Reset</button>
    <button id="btnLvls">Levels</button>
    <button id="btnSnd">Snd On</button>
  </nav>
</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  'use strict';
  var E = window.HeavysideEngine;
  var LEVELS = window.HEAVYSIDE_LEVELS;

  var TICK_MS = 85;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- persistence ----------
  var progress = {};
  try { progress = JSON.parse(localStorage.getItem('heavyside.v1') || '{}'); } catch (e) {}
  function saveProgress() {
    try { localStorage.setItem('heavyside.v1', JSON.stringify(progress)); } catch (e) {}
  }

  // ---------- audio (tiny synth) ----------
  var ac = null, sndOn = true;
  function audio() {
    if (!sndOn) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, slide) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.08, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function noise(dur, vol) {
    var a = audio(); if (!a) return;
    var n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = a.createBufferSource(); src.buffer = buf;
    var g = a.createGain(); g.gain.value = vol || 0.1;
    src.connect(g); g.connect(a.destination); src.start();
  }
  var sfx = {
    whoosh: function () { tone(180, 0.16, 'sine', 0.05, 90); },
    thud: function () { tone(95, 0.1, 'triangle', 0.1, 55); },
    star: function (n) { tone(660 * Math.pow(1.25, n || 0), 0.22, 'sine', 0.09, 990 * Math.pow(1.25, n || 0)); },
    smash: function () { noise(0.18, 0.14); tone(140, 0.15, 'square', 0.05, 60); },
    zap: function () { tone(320, 0.35, 'sawtooth', 0.1, 40); noise(0.25, 0.1); },
    win: function () { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { tone(f, 0.3, 'sine', 0.09); }, i * 90); }); },
    deny: function () { tone(150, 0.08, 'square', 0.04); }
  };

  // ---------- dom ----------
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var elMv = $('mv'), elPar = $('par'), elStarCt = $('starCt'), elStarTot = $('starTot');
  var elLvName = $('lvName'), elLevelTag = $('levelTag'), elCompass = $('compass'), elHint = $('hint');
  var elToast = $('toast');

  // ---------- game state ----------
  var lvIndex = 0, level = null, cur = null, undoStack = [], mvCount = 0;
  var anim = null;          // {frames, events, start, endState, countMove}
  var particles = [];
  var shake = 0;
  var gravName = 'down';
  var starPop = 0;          // ascending star chime index per level
  var busyOverlay = false;

  var COMPASS = { up: '↑', down: '↓', left: '←', right: '→' };

  function toast(msg, ms) {
    elToast.textContent = msg;
    elToast.style.opacity = 1;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { elToast.style.opacity = 0; }, ms || 1100);
  }

  function updateHud() {
    elMv.textContent = mvCount;
    elPar.textContent = level.par;
    var taken = cur.starTaken.filter(Boolean).length;
    elStarCt.textContent = taken;
    elStarTot.textContent = level.starCells.length;
    elCompass.textContent = COMPASS[gravName];
  }

  function startLevel(i) {
    lvIndex = i;
    level = E.parseLevel(LEVELS[i]);
    cur = E.initialState(level);
    undoStack = [];
    mvCount = 0;
    gravName = 'down';
    starPop = 0;
    particles = [];
    busyOverlay = false;
    $('winOvl').classList.remove('show');
    $('endOvl').classList.remove('show');
    $('lvlOvl').classList.remove('show');
    elLevelTag.textContent = 'Level ' + (i + 1) + ' / ' + LEVELS.length;
    elLvName.innerHTML = '<b>' + level.name + '</b>';
    elHint.textContent = level.hint;
    updateHud();
    // free initial settle
    var res = E.applyMove(level, cur, 'down');
    if (res.frames.length > 1) beginAnim(res, false);
    else cur = res.state;
  }

  function beginAnim(res, countMove) {
    anim = {
      frames: res.frames,
      events: res.events,
      endState: res.state,
      start: performance.now(),
      fired: {},
      countMove: countMove
    };
  }

  function doMove(dir) {
    if (anim || busyOverlay || cur.won || cur.dead) return;
    var res = E.applyMove(level, cur, dir);
    gravName = dir;
    updateHud();
    if (res.frames.length <= 1) { sfx.deny(); shake = Math.max(shake, 2.5); return; }
    undoStack.push({ state: E.cloneState(cur), moves: mvCount, grav: gravName, starPop: starPop });
    mvCount++;
    sfx.whoosh();
    beginAnim(res, true);
    updateHud();
  }

  function undo() {
    if (anim || busyOverlay) return;
    var u = undoStack.pop();
    if (!u) { sfx.deny(); return; }
    cur = u.state; mvCount = u.moves; starPop = u.starPop;
    updateHud();
  }

  function finishAnim() {
    cur = anim.endState;
    anim = null;
    sfx.thud();
    updateHud();
    if (cur.dead) {
      sfx.zap();
      shake = 9;
      toast('ZAPPED — rewinding');
      busyOverlay = true;
      setTimeout(function () {
        busyOverlay = false;
        var u = undoStack.pop();
        if (u) { cur = u.state; mvCount = u.moves; starPop = u.starPop; }
        else startLevel(lvIndex);
        updateHud();
      }, 700);
      return;
    }
    if (cur.won) {
      sfx.win();
      var allStars = cur.starTaken.every(Boolean);
      var stars = 1 + (allStars ? 1 : 0) + (allStars && mvCount <= level.par ? 1 : 0);
      var prev = progress[lvIndex] || 0;
      if (stars > prev) { progress[lvIndex] = stars; saveProgress(); }
      busyOverlay = true;
      setTimeout(function () { showWin(stars); }, 550);
    }
  }

  function showWin(stars) {
    var s = '';
    for (var i = 1; i <= 3; i++) s += i <= stars ? '★' : '☆';
    $('winStars').textContent = s;
    var sub = mvCount + ' moves · par ' + level.par;
    if (stars < 3 && level.starCells.length) sub += ' · 3★ = all stars within par';
    $('winSub').textContent = sub;
    $('btnNext').textContent = lvIndex + 1 < LEVELS.length ? 'Next level' : 'Finish';
    $('winOvl').classList.add('show');
  }

  // ---------- level select ----------
  function openLevels() {
    var grid = $('levelGrid');
    grid.innerHTML = '';
    LEVELS.forEach(function (def, i) {
      var b = document.createElement('button');
      var got = progress[i] || 0, s = '';
      for (var k = 1; k <= 3; k++) s += k <= got ? '★' : '<span class="off">☆</span>';
      b.innerHTML = '<span class="lv-name">' + (i + 1) + '. ' + def.name + '</span><span class="lv-stars">' + s + '</span>';
      b.onclick = function () { startLevel(i); };
      grid.appendChild(b);
    });
    busyOverlay = true;
    $('winOvl').classList.remove('show');
    $('endOvl').classList.remove('show');
    $('lvlOvl').classList.add('show');
  }

  $('btnNext').onclick = function () {
    if (lvIndex + 1 < LEVELS.length) startLevel(lvIndex + 1);
    else {
      var total = 0; LEVELS.forEach(function (_, i) { total += progress[i] || 0; });
      $('endStars').textContent = '★ ' + total + ' / ' + LEVELS.length * 3;
      $('winOvl').classList.remove('show');
      $('endOvl').classList.add('show');
    }
  };
  $('btnReplay').onclick = function () { startLevel(lvIndex); };
  $('btnAgain').onclick = openLevels;
  $('btnCloseLvls').onclick = function () { $('lvlOvl').classList.remove('show'); busyOverlay = false; };
  $('btnUndo').onclick = undo;
  $('btnReset').onclick = function () { if (!anim) startLevel(lvIndex); };
  $('btnLvls').onclick = openLevels;
  $('btnSnd').onclick = function () {
    sndOn = !sndOn;
    this.textContent = sndOn ? 'Snd On' : 'Snd Off';
    if (sndOn) sfx.star(0);
  };

  // ---------- input ----------
  window.addEventListener('keydown', function (e) {
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right' };
    if (map[e.key]) { e.preventDefault(); doMove(map[e.key]); }
    else if (e.key === 'u' || e.key === 'z') undo();
    else if (e.key === 'r') { if (!anim) startLevel(lvIndex); }
  });
  var touchStart = null;
  document.addEventListener('touchstart', function (e) {
    if (e.target.closest('button')) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  // mouse-drag swipes for desktop testing
  var mouseStart = null;
  cv.addEventListener('mousedown', function (e) { mouseStart = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mouseup', function (e) {
    if (!mouseStart) return;
    var dx = e.clientX - mouseStart.x, dy = e.clientY - mouseStart.y;
    mouseStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  // ---------- starfield ----------
  var stars = [];
  for (var i = 0; i < 46; i++) stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.4 + 0.4 });
  var GDIR = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  // ---------- rendering ----------
  var dpr = 1, W = 0, H = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = cv.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function boardGeom() {
    var cell = Math.floor(Math.min(W / level.cols, H / level.rows));
    var bw = cell * level.cols, bh = cell * level.rows;
    return { cell: cell, ox: (W - bw) / 2, oy: (H - bh) / 2 };
  }

  function spawnBurst(x, y, color, n, speed) {
    if (reducedMotion) return;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = (Math.random() * 0.6 + 0.4) * speed;
      particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color: color, size: Math.random() * 3 + 1.5 });
    }
  }

  function animPositions(now) {
    // returns {player, stones[], bubbles[], zapDead{}, starGone{}, k}
    var res = { zapDead: {}, starGone: {} };
    if (!anim) {
      res.player = cur.player; res.stones = cur.stones; res.bubbles = cur.bubbles;
      cur.zapperAlive.forEach(function (a, i) { if (!a) res.zapDead[i] = true; });
      cur.starTaken.forEach(function (t, i) { if (t) res.starGone[i] = true; });
      return res;
    }
    var frames = anim.frames;
    var t = Math.max(0, (now - anim.start) / TICK_MS);
    var last = frames.length - 1;
    if (t >= last) t = last;
    var k = Math.max(0, Math.min(Math.floor(t), last - 1));
    var f = Math.max(0, t - k);
    if (last === 0) { k = 0; f = 0; }
    var A = frames[k], B = frames[Math.min(k + 1, last)];

    function lerpEnt(pa, pb, kind) {
      if (!pa && !pb) return null;
      if (pa && pb) return { r: pa.r + (pb.r - pa.r) * f, c: pa.c + (pb.c - pa.c) * f };
      if (pa && !pb) {
        // destroyed this tick: glide into the smash cell
        for (var e = 0; e < anim.events.length; e++) {
          var ev = anim.events[e];
          if (ev.type === 'smash' && ev.tick === k + 1 && ev.fr === pa.r && ev.fc === pa.c) {
            return { r: pa.r + (ev.r - pa.r) * f, c: pa.c + (ev.c - pa.c) * f, fading: f };
          }
        }
        return { r: pa.r, c: pa.c, fading: f };
      }
      return { r: pb.r, c: pb.c };
    }
    res.player = lerpEnt(A.player, B.player, 'player');
    res.stones = A.stones.map(function (p, i) { return lerpEnt(p, B.stones[i]); });
    res.bubbles = A.bubbles.map(function (p, i) { return lerpEnt(p, B.bubbles[i]); });

    // zappers/stars: hidden if consumed before this move, or once their event tick passes
    var passed = k + f;
    level.zapperCells.forEach(function (z, i) {
      var smashedThisMove = anim.events.some(function (ev) {
        return ev.type === 'smash' && ev.r === z.r && ev.c === z.c;
      });
      var smashPassed = anim.events.some(function (ev) {
        return ev.type === 'smash' && ev.r === z.r && ev.c === z.c && ev.tick <= passed + 0.001;
      });
      if ((!anim.endState.zapperAlive[i] && !smashedThisMove) || smashPassed) res.zapDead[i] = true;
    });
    level.starCells.forEach(function (s, i) {
      var takenThisMove = anim.events.some(function (ev) {
        return ev.type === 'star' && ev.r === s.r && ev.c === s.c;
      });
      var takePassed = anim.events.some(function (ev) {
        return ev.type === 'star' && ev.r === s.r && ev.c === s.c && ev.tick <= passed + 0.001;
      });
      if ((anim.endState.starTaken[i] && !takenThisMove) || takePassed) res.starGone[i] = true;
    });
    return res;
  }

  function fireDueEvents(now) {
    if (!anim) return;
    var passed = (now - anim.start) / TICK_MS;
    var g = boardGeom();
    anim.events.forEach(function (ev, idx) {
      if (anim.fired[idx] || ev.tick > passed) return;
      anim.fired[idx] = true;
      var x = g.ox + (ev.c + 0.5) * g.cell, y = g.oy + (ev.r + 0.5) * g.cell;
      if (ev.type === 'star') { sfx.star(starPop++); spawnBurst(x, y, '#ffce4f', 14, 2.6); }
      else if (ev.type === 'smash') { sfx.smash(); shake = Math.max(shake, 5); spawnBurst(x, y, ev.kind === 'bubble' ? '#c98bff' : '#8b96b0', 18, 3.2); spawnBurst(x, y, '#ff5c49', 10, 2.2); }
      else if (ev.type === 'death') { spawnBurst(x, y, '#3ee6d0', 26, 3.6); spawnBurst(x, y, '#ff5c49', 14, 2.8); }
      else if (ev.type === 'win') { spawnBurst(x, y, '#57e07a', 30, 3.4); spawnBurst(x, y, '#3ee6d0', 20, 2.4); }
    });
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // starfield drifting toward gravity
    var gd = GDIR[gravName];
    ctx.fillStyle = 'rgba(199,207,230,0.35)';
    stars.forEach(function (s) {
      if (!reducedMotion) {
        s.x = (s.x + gd[0] * 0.00045 * s.s + 1) % 1;
        s.y = (s.y + gd[1] * 0.00045 * s.s + 1) % 1;
      }
      ctx.globalAlpha = 0.12 + s.s * 0.1;
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    });
    ctx.globalAlpha = 1;

    if (!level) return;
    var g = boardGeom(), cell = g.cell;

    if (shake > 0.3) {
      var sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
      ctx.translate(sx, sy);
      shake *= 0.88;
    } else shake = 0;

    var pos = animPositions(now);
    fireDueEvents(now);

    function px(c) { return g.ox + c * cell; }
    function py(r) { return g.oy + r * cell; }
    function cx(c) { return g.ox + (c + 0.5) * cell; }
    function cy(r) { return g.oy + (r + 0.5) * cell; }

    // board panel + cells
    ctx.fillStyle = '#0d1122';
    rr(g.ox - 4, g.oy - 4, cell * level.cols + 8, cell * level.rows + 8, 10);
    ctx.fill();
    for (var r = 0; r < level.rows; r++) {
      for (var c = 0; c < level.cols; c++) {
        if (level.walls[r * level.cols + c]) {
          ctx.fillStyle = '#1a2138';
          rr(px(c) + 1, py(r) + 1, cell - 2, cell - 2, Math.max(3, cell * 0.14));
          ctx.fill();
          ctx.strokeStyle = '#242e50';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(35,44,74,0.5)';
          ctx.fillRect(cx(c) - 1, cy(r) - 1, 2, 2);
        }
      }
    }

    var t = now / 1000;

    // exit portal
    var ex = cx(level.exit.c), ey = cy(level.exit.r), er = cell * 0.32;
    ctx.save();
    ctx.shadowColor = '#57e07a'; ctx.shadowBlur = reducedMotion ? 6 : 10 + Math.sin(t * 3) * 4;
    ctx.strokeStyle = '#57e07a'; ctx.lineWidth = Math.max(2, cell * 0.06);
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([cell * 0.12, cell * 0.1]);
    ctx.lineDashOffset = -t * cell * 0.6;
    ctx.strokeStyle = 'rgba(87,224,122,0.5)'; ctx.lineWidth = Math.max(1.5, cell * 0.04);
    ctx.beginPath(); ctx.arc(ex, ey, er * 0.62, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    // stars
    level.starCells.forEach(function (s, i) {
      if (pos.starGone[i]) return;
      var x = cx(s.c), y = cy(s.r), R = cell * 0.2 * (1 + (reducedMotion ? 0 : Math.sin(t * 4 + i) * 0.08));
      ctx.save();
      ctx.translate(x, y); ctx.rotate(reducedMotion ? 0 : t * 1.2);
      ctx.shadowColor = '#ffce4f'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffce4f';
      ctx.beginPath();
      for (var k = 0; k < 8; k++) {
        var rad = k % 2 === 0 ? R : R * 0.44;
        var a = k * Math.PI / 4;
        ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    });

    // zappers
    level.zapperCells.forEach(function (z, i) {
      if (pos.zapDead[i]) return;
      var x = cx(z.c), y = cy(z.r), R = cell * 0.26;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(reducedMotion ? 0 : t * 2.4 + i);
      ctx.shadowColor = '#ff5c49'; ctx.shadowBlur = 12;
      ctx.strokeStyle = '#ff5c49'; ctx.lineWidth = Math.max(2, cell * 0.05);
      ctx.beginPath();
      for (var k = 0; k < 6; k++) {
        var a = k * Math.PI / 3;
        ctx.moveTo(Math.cos(a) * R * 0.3, Math.sin(a) * R * 0.3);
        ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      }
      ctx.stroke();
      ctx.fillStyle = '#ff5c49';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.18 * (1 + (reducedMotion ? 0 : Math.sin(t * 8) * 0.25)), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // stones
    pos.stones.forEach(function (p) {
      if (!p) return;
      var x = px(p.c), y = py(p.r), pad = cell * 0.12;
      ctx.save();
      if (p.fading) ctx.globalAlpha = 1 - p.fading;
      ctx.fillStyle = '#8b96b0';
      rr(x + pad, y + pad, cell - pad * 2, cell - pad * 2, cell * 0.16);
      ctx.fill();
      ctx.strokeStyle = '#5c6785'; ctx.lineWidth = Math.max(2, cell * 0.05); ctx.stroke();
      ctx.strokeStyle = 'rgba(28,34,56,0.55)'; ctx.lineWidth = Math.max(1.5, cell * 0.035);
      ctx.beginPath();
      ctx.moveTo(x + cell * 0.3, y + cell * 0.42); ctx.lineTo(x + cell * 0.7, y + cell * 0.42);
      ctx.moveTo(x + cell * 0.3, y + cell * 0.58); ctx.lineTo(x + cell * 0.7, y + cell * 0.58);
      ctx.stroke();
      ctx.restore();
    });

    // bubbles
    pos.bubbles.forEach(function (p, i) {
      if (!p) return;
      var x = cx(p.c), y = cy(p.r), R = cell * 0.32 * (1 + (reducedMotion ? 0 : Math.sin(t * 3 + i * 2) * 0.05));
      ctx.save();
      if (p.fading) ctx.globalAlpha = 1 - p.fading;
      ctx.fillStyle = 'rgba(201,139,255,0.2)';
      ctx.strokeStyle = '#c98bff'; ctx.lineWidth = Math.max(2, cell * 0.05);
      ctx.shadowColor = '#c98bff'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = Math.max(1.5, cell * 0.035);
      ctx.beginPath(); ctx.arc(x - R * 0.25, y - R * 0.25, R * 0.45, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
      ctx.restore();
    });

    // player orb
    if (pos.player && !(cur.dead && !anim)) {
      var x = cx(pos.player.c), y = cy(pos.player.r), R = cell * 0.3;
      ctx.save();
      ctx.shadowColor = '#3ee6d0'; ctx.shadowBlur = 16;
      var grad = ctx.createRadialGradient(x - R * 0.3, y - R * 0.3, R * 0.1, x, y, R);
      grad.addColorStop(0, '#b8fff4');
      grad.addColorStop(0.55, '#3ee6d0');
      grad.addColorStop(1, '#0e9e8c');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
      // eyes look toward gravity
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#07231f';
      var lx = gd[0] * R * 0.22, ly = gd[1] * R * 0.22;
      ctx.beginPath(); ctx.arc(x - R * 0.3 + lx, y - R * 0.12 + ly, R * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + R * 0.3 + lx, y - R * 0.12 + ly, R * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // particles
    particles = particles.filter(function (p) { return p.life > 0; });
    particles.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.025;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    // finish animation?
    if (anim && (now - anim.start) / TICK_MS >= anim.frames.length - 1) finishAnim();
  }

  function loop(now) {
    render(now);
    requestAnimationFrame(loop);
  }

  startLevel(0);
  requestAnimationFrame(loop);
})();
</script>
